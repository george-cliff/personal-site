media:
  input: public/images
  output: /images

content:
  - name: devlog
    label: Devlog
    type: collection
    path: src/content/devlog
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: title
        type: string
        required: true
      - name: pubDate
        label: Publication date
        type: date
      - name: body
        type: rich-text
